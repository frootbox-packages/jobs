# Backend (decisions 0220, 0231)
"New job": "Neue Stelle"
"Open positions, apprenticeships and internships. Visitors apply through the form on each job.": "Offene Stellen, Ausbildungsplätze und Praktika. Besucher bewerben sich über das Formular an jeder Stelle."
"No jobs yet": "Noch keine Stellen"
"Kind not set": "Art nicht angegeben"
"The job is saved as a draft.": "Die Stelle ist als Entwurf gespeichert."
"The job is published.": "Die Stelle ist veröffentlicht."
"Visitors in this language do not see the job.": "Besucher in dieser Sprache sehen die Stelle nicht."
"The job goes offline by itself, e.g. at the end of applications. Search engines learn the day too.": "Die Stelle geht von selbst offline, z. B. zum Ende der Bewerbungsfrist. Auch Suchmaschinen erfahren den Tag."
"Only for a published job.": "Nur für eine veröffentlichte Stelle."
"Delete the job": "Stelle löschen"
"Your changes to this job are lost. The published version stays.": "Deine Änderungen an dieser Stelle gehen verloren. Die veröffentlichte Fassung bleibt."
"The job was never published and is gone afterwards.": "Die Stelle war nie veröffentlicht und ist danach weg."
"The job is offline.": "Die Stelle ist offline."
"Visitors no longer find the job. It stays as a draft and can be published again.": "Besucher finden die Stelle nicht mehr. Sie bleibt als Entwurf und lässt sich wieder veröffentlichen."
"The job is deleted.": "Die Stelle ist gelöscht."
"The job leaves the list and the website. Visitors no longer find it.": "Die Stelle verschwindet aus der Liste und von der Website. Besucher finden sie nicht mehr."
"Name the job as people search for it, e.g. \"Barista (m/f/d)\".": "Nenn die Stelle so, wie Leute danach suchen, z. B. „Barista (m/w/d)“."
"The last part of the address of the job. If it changes, the old one redirects to the new one.": "Der letzte Teil der Adresse der Stelle. Ändert er sich, leitet die alte Adresse auf die neue weiter."
"Tasks, profile and what you offer, each with a subheading.": "Aufgaben, Profil und was Du bietest, jeweils mit einer Zwischenüberschrift."
"Start": "Beginn"
"Left empty for as soon as possible.": "Leer lassen für „ab sofort“."
