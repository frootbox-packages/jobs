"Newer": "Neuere"
"Older": "Ältere"
"Save as a draft": "Als Entwurf speichern"
"Teaser": "Anriss"
"A few sentences for the list and for search engines.": "Ein paar Sätze für die Liste und für Suchmaschinen."
"The open jobs of the space the page shows, the newest first, filtered by kind and location. Each job gets its own address below the page; there it shows the job with the person to contact and the application form.": "Die offenen Stellen der Verwaltung, die die Seite zeigt, die neuesten zuerst, nach Art und Standort filterbar. Jede Stelle bekommt eine eigene Adresse unter der Seite; dort steht die Stelle mit Ansprechperson und Bewerbungsformular."
"There is no such space of the jobs.": "Diese Verwaltung gibt es in den Stellenangeboten nicht."
Space: Verwaltung
