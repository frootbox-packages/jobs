"per hour": "pro Stunde"
"per month": "im Monat"
"per year": "im Jahr"
"Currency": "Währung"
"In whole amounts. Search engines show the salary, and many people only apply with one.": "In ganzen Beträgen. Suchmaschinen zeigen das Gehalt, und viele bewerben sich nur mit einer Angabe."
"No location": "Kein Standort"
"From the locations under People. Visitors can filter the list by it.": "Aus den Standorten unter Personen. Besucher können die Liste danach filtern."
"Create locations under People to name where the job is.": "Leg unter Personen Standorte an, um zu nennen, wo die Stelle ist."
"Contact": "Kontakt"
"No contact": "Keine Ansprechperson"
"The person applicants can ask, from the people under People.": "Die Person, die Bewerber fragen können, aus den Personen unter Personen."
